# First-response checklists. Placeholders in {braces} are filled from the alert and the catalog.
# Order matters: read the alert and runbook, collect evidence, then change something.

assess:
  - "Read the alert: priority {priority}, what happened, service {service}, environment {environment}."
  - "Open the runbook before doing anything else: {runbook}"
  - "Acknowledge Opsgenie alert {opsgenie_id} so others know it is being handled."

# Non-prod has no real customers, so the question there is who is blocked.
impact:
  prod: "Check customer impact: is {service} in {environment} failing for users right now?"
  non_prod: "Check who is blocked: is {environment} needed for testing or a release right now?"

# Evidence every alert type needs, collected before any change.
evidence_common:
  - "Save the relevant Grafana dashboard panels (traffic, errors, latency) for the time around {started_at}."
  - "Check the Kubernetes state of {service}: pod status, restarts, recent events."
  - "Collect logs from {service} for the time around {started_at}; add a sample as a note on the Opsgenie alert."
  - "Test {service} yourself as a customer would (call the affected endpoint) and record the result."
  - "Check code, deploy and config changes to {service} in the hours before {started_at}."
  - "Check whether planned maintenance or a change window covers {service} or its dependencies."

alerts:
  HighErrorRate:
    evidence:
      - "Note the error rate ({value} vs threshold {threshold}) and group errors by endpoint and status code."
      - "Check the dependencies listed in the runbook for errors at the same time."
    mitigate:
      - "If a change lines up with the start time, follow the runbook's rollback procedure."
  HighLatency:
    evidence:
      - "Note the latency ({value} vs threshold {threshold}) and which endpoints are slow."
      - "Check saturation: CPU, memory, connection pools, queue depth, and whether traffic spiked."
      - "Check latency of downstream dependencies (database, other APIs)."
    mitigate:
      - "If saturated, scale out as the runbook describes; if a change lines up with the start, follow the rollback procedure."
  DependencyDown:
    evidence:
      - "Confirm which dependency is failing from a second source (its status page or health check)."
      - "Check whether the failure is total or partial, and which features of {service} rely on it."
      - "Check whether the dependency's owners already have an open incident."
    mitigate:
      - "Use the runbook's degraded mode or failover if one exists. Restarting {service} will not fix a dependency."
  ServiceDown:
    evidence:
      - "Confirm it is really down from a second signal (synthetic check, load balancer health), not a monitoring gap."
    mitigate:
      - "Follow the runbook's restart or rollback procedure."

# Always shown right before the mitigation steps.
guardrail: "Only do steps the runbook gives to the on-call / EOC role. If a step belongs to another team (for example engineers restart the service), escalate to them instead of doing it yourself."

# Escalation is a decision of the on-call person, following the runbook. The only automatic
# escalation is Opsgenie's escalation policy, when nobody acknowledges the alert in time.
escalate:
  ack: "If nobody acknowledges the alert within {ack_timeout_minutes} minutes, Opsgenie escalates it automatically to {escalation}."
  manual: "If the runbook says to escalate, or you cannot mitigate it, escalate to {escalation}. Include what you checked, the evidence collected, and what you already tried."
  p1: "Open an Opsgenie incident and assign someone to customer communication."

close:
  - "Before closing Opsgenie alert {opsgenie_id}, add a note with what was checked, what happened, and how it was resolved. Do not close it without this."

manual_review:
  - "Do not change anything yet. Confirm the alert is real by checking the monitor that sent it."
  - "Find the owner of '{service}': search the service inventory, ask in the EOC channel."
  - "Decide the priority by hand, set it on Opsgenie alert {opsgenie_id}, and add a note with the reason."
  - "When handing over, include what you checked and why the alert was unclear."
  - "Remove the ambiguity for next time: add the service, environment or alert type to the catalog or fix the alert definition."

# Unreadable or invalid alert. It may still be real, so a person looks at the raw payload.
rejected:
  - "Do not assume it is harmless: read the raw payload attached to Opsgenie alert {opsgenie_id} and find which monitor sent it."
  - "If it mentions a production service or an outage, treat it as urgent and check that service's dashboards now."
  - "Ask the owner of that monitor to fix the alert format, using the errors listed in the Opsgenie alert."
