[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alert-triage"
version = "0.1.0"
description = "Triage synthetic alerts into priorities, owners and first-response checklists"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
alert-triage = "alert_triage.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "build==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alert_triage = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
